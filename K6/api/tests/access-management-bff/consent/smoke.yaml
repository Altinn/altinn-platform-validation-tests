# Deliberately not access-management: namespace becomes the Kubernetes namespace of
# the generated CronJob, and only the namespaces in Altinn/altinn-platform
# altinn-monitor-test-rg/k6_tests_rg_rbac.tf exist. access-management is not one
# of them yet, so changing this breaks the scheduled runs until it is added there.
namespace: authentication
base_dir: K6/api/tests/access-management-bff/consent
test_definitions:
  - test_scope: consent-bff
    test_file: consent-log-worst-case.js
    config_file: "conf-worst-case.json"
    contexts:
      - environment: yt01
  - test_scope: consent-bff
    test_file: consent-requests-worst-case.js
    config_file: "conf-worst-case.json"
    contexts:
      - environment: yt01

  - test_scope: consent-bff
    test_file: consent-log.js
    contexts:
      - environment: yt01
        test_type:
          type: smoke
          enabled: true
          config_file: conf.json
      - environment: at23

  - test_scope: consent-bff
    test_file: consent-requests.js
    contexts:
      - environment: yt01
        test_type:
          type: smoke
          enabled: true
          config_file: conf.json
      - environment: at23
