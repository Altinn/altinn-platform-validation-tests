namespace: resource-registry
base_dir: K6/api/tests/resource-registry
test_definitions:
  # The pdp sits behind API management, so it needs the subscription key.
  - test_file: access-list-enforcement.js
    contexts:
      - environment: at22
        test_run:
          secrets:
            - authorization-subscription-key-at22
      - environment: at23
        test_run:
          secrets:
            - authorization-subscription-key-at23
      - environment: tt02
        test_run:
          secrets:
            - authorization-subscription-key-tt02
  # Contact points came into the export with Altinn/altinn-auth#4582. Add tt02,
  # yt01 and prod once it is released there.
  - test_file: export-contact-points.js
    contexts:
      - environment: at22
      - environment: at23
