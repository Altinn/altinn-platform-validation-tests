  # at23 and yt01, 7.7 MB in prod and 15 MB in tt02.
  - test_file: list-and-search-resources.js
    contexts:
      - environment: at22
      - environment: at23
      - environment: tt02
      - environment: yt01
      - environment: prod
  - test_file: get-resource-changes.js
    contexts:
      - environment: at22
      - environment: at23
      - environment: tt02
      - environment: yt01
      - environment: prod
