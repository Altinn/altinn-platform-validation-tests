name: Detect New Swagger Versions

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-swagger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: helpers/detect-new-swagger-versions/go.mod
          cache-dependency-path: helpers/detect-new-swagger-versions/go.sum

      - name: Check Swagger documents
        working-directory: helpers/detect-new-swagger-versions
        run: go run .

      # TODO: Send a slack notification whenever we create a channel
