name: Playwright Cronjobs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hack/playwright-cronjobs.jsonnet"
      - "hack/run-playwright-tests.sh"
      - ".github/workflows/generate-and-apply-playwright-cronjobs.yml"

permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"

      - name: Install jsonnet
        run: |
          sudo apt-get update
          sudo apt-get install -y jsonnet

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/v4.53.6/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Generate CronJobs
        run: |
          hack/generate_playwright_cronjobs.sh

      - name: "Setup k8s client"
        uses: "./.github/actions/setup-k8s"
        with:
          azure-client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          azure-subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azure-tenant-id: "${{ secrets.AZURE_TENANT_ID }}"

      - name: "Apply Playwright Cronjobs"
        run: "kubectl apply -f .dist/ -R"
        shell: "bash"
