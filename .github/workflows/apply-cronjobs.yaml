name: "Generate and Apply K6 CronJobs"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # The schedules are in the config files, and the CronJobs are made by testudo.
      - "K6/**/functional.yaml"
      - "K6/**/healthcheck.yaml"
      - "K6/**/smoke.yaml"
      - "K6/**/browser.yaml"
      - "K6/**/breakpoint.yaml"
      - "helpers/testudo/**"
run-name: "cronjobs"
permissions:
  contents: "read"
  id-token: write
jobs:
  cronjobs:
    runs-on: "ubuntu-latest"
    environment: "test"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helpers/testudo/go.mod
          cache-dependency-path: helpers/testudo/go.sum

      - name: "Generate Cronjobs"
        # One call for all files, since testudo empties .cronjobs/ first.
        run: |
          go -C helpers/testudo build -o "$RUNNER_TEMP/testudo" .
          mapfile -t config_files < <(find K6 -type f \( -name functional.yaml -o -name healthcheck.yaml -o -name smoke.yaml -o -name browser.yaml -o -name breakpoint.yaml \) | sort)
          "$RUNNER_TEMP/testudo" k6 generate --cronjobs-only "${config_files[@]}"
        shell: "bash"

      - name: "Setup k8s client"
        uses: "./.github/actions/setup-k8s"
        with:
          azure-client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          azure-subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azure-tenant-id: "${{ secrets.AZURE_TENANT_ID }}"

      - name: "Apply CronJobs"
        run: "kubectl apply -f .cronjobs/ -R || true"
        shell: "bash"
