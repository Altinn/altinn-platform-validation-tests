name: Build and Push Playwright runner Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "playwright/package.json"
      - "infra/playwright/run-playwright-tests.sh"
      - "infra/playwright/Dockerfile"
      - ".github/workflows/build-and-push-playwright-runner-image.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push-playwright-runner:
    runs-on: ubuntu-latest
    environment: "test"
    steps:
      - name: Checkout
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"

      - name: Get Playwright version
        id: playwright
        run: |
          version=$(jq -r '.devDependencies."@playwright/test"' playwright/package.json)

          if [ "$version" = "null" ]; then
            echo "Could not find @playwright/test in playwright/package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Login to ACR
        run: az acr login --name altinnplatformvalidationtests

      - name: Build image
        run: |
          docker build \
                  --build-arg PLAYWRIGHT_VERSION="${{ steps.playwright.outputs.version }}" \
                  -t "altinnplatformvalidationtests.azurecr.io/custom-playwright-runner:${{ steps.playwright.outputs.version }}" \
                  infra/playwright

      - name: Push image
        run: |
          docker push \
            "altinnplatformvalidationtests.azurecr.io/custom-playwright-runner:${{ steps.playwright.outputs.version }}"
